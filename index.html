    <meta property="og:title" content="LiLouPro" />
    <meta property="og:description" content="Sistema completo de gestão para grupos de louvor: escalas, disponibilidade de membros e repertório digital com cifras transponíveis." />
    <script>
      window.__deferredPwaPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__deferredPwaPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
      });
      window.addEventListener('appinstalled', function() {
        window.__deferredPwaPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa-app-installed'));
      });
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
